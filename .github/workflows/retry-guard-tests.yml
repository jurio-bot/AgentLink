name: Retry Guard tests

on:
  push:
    paths:
      - 'tools/retry_guard.py'
      - 'tools/test_retry_guard.py'
      - '.github/workflows/retry-guard-tests.yml'
  pull_request:
    paths:
      - 'tools/retry_guard.py'
      - 'tools/test_retry_guard.py'
      - '.github/workflows/retry-guard-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        working-directory: tools
        run: python -m unittest -v test_retry_guard.py
