name: URL contract check tests

on:
  push:
    paths:
      - "tools/url_contract_check.py"
      - "tests/test_url_contract_check.py"
      - ".github/workflows/url-contract-check-tests.yml"
  pull_request:
    paths:
      - "tools/url_contract_check.py"
      - "tests/test_url_contract_check.py"
      - ".github/workflows/url-contract-check-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run URL contract tests
        run: pytest -q tests/test_url_contract_check.py
