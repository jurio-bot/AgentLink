name: Project inquiry
description: Non-confidential inquiry for AI automation, Python/API, RAG, agent, or reliability work
title: "[Inquiry] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out. Please keep this public issue non-confidential. Do not include passwords, API keys, personal data, client secrets, contracts, proprietary datasets, private URLs, or security-sensitive details.
  - type: dropdown
    id: work_type
    attributes:
      label: What kind of work are you considering?
      options:
        - AI workflow / business automation
        - Python / API integration
        - RAG proof-of-concept
        - AI Agent / multi-step workflow PoC
        - Architecture / technical audit
        - Reliability / recovery / duplicate-action review
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to improve or automate?
      description: Describe the problem and desired outcome without confidential information.
    validations:
      required: true
  - type: textarea
    id: current_stack
    attributes:
      label: Current tools or data sources
      description: Product names or general data types are enough. Do not include credentials, private URLs, or customer data.
  - type: textarea
    id: output
    attributes:
      label: Desired deliverable
      description: What would a useful result look like?
    validations:
      required: true
  - type: input
    id: timing
    attributes:
      label: Timing / urgency
  - type: textarea
    id: constraints
    attributes:
      label: Security, deployment, or operating constraints
      description: Keep this high level. Do not include secrets, private endpoints, or confidential architecture details.
  - type: checkboxes
    id: public_ack
    attributes:
      label: Public issue acknowledgment
      options:
        - label: I understand this issue is public and I have not included secrets, contracts, customer data, or other confidential information.
          required: true
