name: Paid service request
about: Request a non-confidential AgentLink audit or PoC
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in AgentLink. Please share only non-confidential information here. Do not post credentials, API keys, personal data, proprietary datasets, private URLs, or security-sensitive details.
  - type: dropdown
    id: service
    attributes:
      label: Service
      options:
        - AI Agent / RAG Architecture Quick Audit (¥9,800 fixed)
        - AI Automation / Small PoC (from ¥29,800)
        - Working Python / API / RAG PoC (from ¥59,800)
        - Multi-step AI Agent / RAG PoC (from ¥98,000)
        - Enterprise design-partner PoC
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What do you want to improve or build?
      description: Keep this high level and non-confidential.
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Current tools / data sources
      description: Names of products or general data types are enough. Do not include credentials or private URLs.
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Deadline or urgency
  - type: textarea
    id: constraints
    attributes:
      label: Security / deployment constraints
  - type: checkboxes
    id: consent
    attributes:
      label: Safety check
      options:
        - label: I confirm this issue contains no credentials, secrets, private customer data, or other confidential information.
          required: true
